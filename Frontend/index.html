<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalStock Pro - Control de Inventario</title>
    <style>
        
        :root {
            --bg-principal: #f3f4f6;
            --bg-card: #ffffff;
            --texto-dark: #1f2937;
            --texto-light: #4b5563;
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --success: #10b981; 
            --success-hover: #059669;
            --warning: #f59e0b; 
            --warning-hover: #d97706;
            --danger: #ef4444; 
            --danger-hover: #dc2626;
            --borde: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-principal);
            margin: 0;
            padding: 0;
            color: var(--texto-dark);
        }

        
        header {
            background-color: #1e293b;
            color: white;
            padding: 15px 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header .badge {
            background-color: var(--primary);
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
        }

        
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        
        .column {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--borde);
            transition: transform 0.2s ease;
        }

        .column:hover {
            transform: translateY(-2px);
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--texto-dark);
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-principal);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .seccion-interna {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--borde);
        }

        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--texto-light);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #f9fafb;
            color: var(--texto-dark);
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

       
        button {
            width: 100%;
            padding: 11px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-blue { background-color: var(--primary); color: white; }
        .btn-blue:hover { background-color: var(--primary-hover); }

        .btn-orange { background-color: var(--warning); color: white; }
        .btn-orange:hover { background-color: var(--warning-hover); }

        .btn-red { background-color: var(--danger); color: white; }
        .btn-red:hover { background-color: var(--danger-hover); }

        
        .table-container {
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--borde);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 0.88rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--texto-light);
            font-weight: 600;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid var(--borde);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--borde);
            color: var(--texto-dark);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        
        .btn-group {
            display: flex;
            gap: 4px;
        }

        .btn-small {
            width: auto;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-danger-light {
            background-color: #fee2e2;
            color: var(--danger);
        }
        .btn-danger-light:hover {
            background-color: var(--danger);
            color: white;
        }

       
        .nulo {
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <h1>⚙️ MetalStock <span class="badge">v2.1</span></h1>
    <span style="font-size: 0.9rem; color: #94a3b8;">Taller & Inventario</span>
</header>

<div class="container">
    
    <div class="column">
        <h2>📦 Bodega de Materiales</h2>
        
        <label>Nombre del Material</label>
        <input type="text" id="nombreMaterial" placeholder="Ej. Tubo Galvanizado 2x2">
        
        <label>Cantidad Inicial</label>
        <input type="number" id="cantidadInicial" placeholder="0.00" min="0" step="any">
        
        <label>Unidad de Medida</label>
        <input type="text" id="unidadMaterial" placeholder="Ej. Metros, Unidades, Kg">
        
        <button class="btn-blue" onclick="guardarMaterial()">➕ Agregar Material</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMateriales"></tbody>
            </table>
        </div>
    </div>

    <div class="column">
        <h2>👥 Clientes y Proyectos</h2>
        
        <label>Nombre del Cliente</label>
        <input type="text" id="nombreCliente" placeholder="Ej. Juan Pérez">
        
        <label>Trabajo / Obra</label>
        <input type="text" id="trabajoCliente" placeholder="Ej. Estructura Techo">
        
        <button class="btn-blue" onclick="registrarCliente()">💾 Registrar Cliente</button>

        <div class="seccion-interna">
            <h2>🛠️ Registrar Consumo</h2>
            
            <label>Seleccionar Cliente</label>
            <select id="selectClienteConsumo">
                <option value="">-- Seleccione un cliente --</option>
            </select>
            <button class="btn-red btn-small" style="margin-bottom: 15px; font-size: 0.75rem;" onclick="borrarClienteSeleccionado()">❌ Eliminar Cliente Seleccionado</button>

            <label>Material Utilizado</label>
            <select id="selectMaterialConsumo">
                <option value="">-- Seleccione un material --</option>
            </select>
            
            <label>Cantidad a Descontar</label>
            <input type="number" id="cantidadConsumo" placeholder="0.00" min="0" step="any">
            
            <button class="btn-orange" onclick="vincularConsumo()">⚙️ Vincular e Inyectar al Historial</button>
        </div>
    </div>

    <div class="column">
        <h2>
            📜 Historial de Salidas
            <button class="btn-red btn-small" style="width: auto;" onclick="vaciarHistorialCompleto()">🗑️ Vaciar Todo</button>
        </h2>
        
        <p style="font-size: 0.8rem; color: var(--texto-light); margin-top: -10px; margin-bottom: 15px;">
            Haga clic en la ❌ de una fila para revertir o limpiar registros individuales.
        </p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Material</th>
                        <th>Cant.</th>
                        <th>Limpiar</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let materialesGlobal = [];
    let clientesGlobal = [];

    document.addEventListener("DOMContentLoaded", () => {
        cargarMateriales();
        cargarClientes();
        cargarHistorial();
    });

    async function cargarMateriales() {
        const response = await fetch('/api/materiales');
        materialesGlobal = await response.json();
        
        const tabla = document.getElementById('tablaMateriales');
        const select = document.getElementById('selectMaterialConsumo');
        tabla.innerHTML = '';
        select.innerHTML = '<option value="">-- Seleccione un material --</option>';

        materialesGlobal.forEach(m => {
            tabla.innerHTML += `
                <tr>
                    <td><b>${m.nombre}</b></td>
                    <td>${m.cantidad} <span style="color:var(--texto-light); font-size:0.75rem;">${m.unidad}</span></td>
                    <td class="btn-group">
                        <button class="btn-red btn-small" onclick="ajustarStock(${m.id}, -1)">-</button>
                        <button class="btn-blue btn-small" onclick="ajustarStock(${m.id}, 1)">+</button>
                        <button class="btn-danger-light btn-small" onclick="eliminarMaterial(${m.id})" title="Eliminar de bodega">✕</button>
                    </td>
                </tr>
            `;
            select.innerHTML += `<option value="${m.id}">${m.nombre} (${m.cantidad} disp.)</option>`;
        });
    }

    async function guardarMaterial() {
        const nombre = document.getElementById('nombreMaterial').value;
        const cantidad = parseFloat(document.getElementById('cantidadInicial').value);
        const unidad = document.getElementById('unidadMaterial').value;

        if(!nombre || isNaN(cantidad) || cantidad < 0 || !unidad) { 
            alert("Completa todos los campos de material con valores válidos (no negativos)."); 
            return; 
        }

        const material = { nombre, cantidad, unidad };

        await fetch('/api/materiales', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(material)
        });

        document.getElementById('nombreMaterial').value = '';
        document.getElementById('cantidadInicial').value = '';
        document.getElementById('unidadMaterial').value = '';
        cargarMateriales();
    }

    
    async function ajustarStock(id, ajuste) {
        const material = materialesGlobal.find(m => m.id === id);
        
        if (material) {
            const nuevoStock = material.cantidad + ajuste;
            
            if (nuevoStock < 0) {
                alert("Operación cancelada: No puedes dejar el stock en números negativos.");
                return;
            }
        }

        await fetch(`/api/materiales/${id}/stock?ajuste=${ajuste}`, { method: 'PUT' });
        cargarMateriales();
    }

    async function eliminarMaterial(id) {
        if (confirm("¿Deseas eliminar este material permanentemente de la bodega?")) {
            await fetch(`/api/materiales/${id}`, { method: 'DELETE' });
            cargarMateriales();
        }
    }

    async function cargarClientes() {
        const response = await fetch('/api/clientes');
        clientesGlobal = await response.json();
        
        const select = document.getElementById('selectClienteConsumo');
        select.innerHTML = '<option value="">-- Seleccione un cliente --</option>';

        clientesGlobal.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.nombre} [${c.trabajo}]</option>`;
        });
    }

    async function registrarCliente() {
        const nombre = document.getElementById('nombreCliente').value;
        const trabajo = document.getElementById('trabajoCliente').value;

        if(!nombre || !trabajo) { alert("Completa los datos del cliente."); return; }

        const cliente = { nombre, trabajo };

        await fetch('/api/clientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cliente)
        });

        document.getElementById('nombreCliente').value = '';
        document.getElementById('trabajoCliente').value = '';
        cargarClientes();
    }

    async function borrarClienteSeleccionado() {
        const idCliente = document.getElementById('selectClienteConsumo').value;
        if (!idCliente) { alert("Por favor, selecciona un cliente de la lista primero."); return; }
        
        if (confirm("Al borrar este cliente se aplicará el borrado en cascada eliminando también su historial. ¿Continuar?")) {
            await fetch(`/api/clientes/${idCliente}`, { method: 'DELETE' });
            cargarClientes();
            cargarHistorial(); 
        }
    }

    async function vincularConsumo() {
        const idCliente = document.getElementById('selectClienteConsumo').value;
        const idMaterial = document.getElementById('selectMaterialConsumo').value;
        const cantidadUsar = parseFloat(document.getElementById('cantidadConsumo').value);

        if (!idCliente || !idMaterial || isNaN(cantidadUsar) || cantidadUsar <= 0) {
            alert("Verifica los datos seleccionados y que la cantidad sea mayor a 0.");
            return;
        }

        const materialSeleccionado = materialesGlobal.find(m => m.id == idMaterial);
        if (materialSeleccionado && cantidadUsar > parseFloat(materialSeleccionado.cantidad)) {
            alert("Error: Stock insuficiente en bodega para realizar el descuento.");
            return; 
        }

        try {
            const response = await fetch(`/api/consumos/registrar?clienteId=${idCliente}&materialId=${idMaterial}&cantidadUsada=${cantidadUsar}`, {
                method: 'POST'
            });

            if (!response.ok) {
                alert("Error en servidor: " + await response.text());
                return;
            }

            document.getElementById('cantidadConsumo').value = '';
            cargarMateriales(); 
            cargarHistorial();  
            
        } catch (error) {
            console.error(error);
        }
    }

    async function cargarHistorial() {
        const response = await fetch('/api/consumos');
        const consumos = await response.json();
        
        const tabla = document.getElementById('tablaHistorial');
        tabla.innerHTML = '';

        if(consumos.length === 0){
            tabla.innerHTML = `<tr><td colspan="4" style="text-align:center; color:gray; padding:20px;">Historial vacío</td></tr>`;
            return;
        }

        consumos.forEach(c => {
            const nombreCliente = c.cliente ? c.cliente.nombre : '<span class="nulo">Nulo (Borrado)</span>';
            const nombreMaterial = c.material ? c.material.nombre : '<span class="nulo">Nulo (Borrado)</span>';
            
            tabla.innerHTML += `
                <tr>
                    <td>${nombreCliente}</td>
                    <td>${nombreMaterial}</td>
                    <td><b>${c.cantidadUsada}</b></td>
                    <td>
                        <button class="btn-red btn-small btn-danger-light" onclick="eliminarRegistroHistorial(${c.id})">❌</button>
                    </td>
                </tr>
            `;
        });
    }

    async function eliminarRegistroHistorial(id) {
        if (confirm("¿Remover esta línea del historial?")) {
            await fetch(`/api/consumos/${id}`, { method: 'DELETE' });
            cargarHistorial();
        }
    }

    async function vaciarHistorialCompleto() {
        if (confirm("¿Estás seguro de que deseas limpiar todo el historial de salidas? Esta acción no alterará el inventario ni tus clientes actuales.")) {
            await fetch('/api/consumos/vaciar', { method: 'DELETE' });
            cargarHistorial();
        }
    }
</script>
</body>
</html>
